# ============================================================
#  全局规则
#  这些数字决定了一局的节奏，改完跑 `npm run content` 生效。
# ============================================================

# 开局年龄。16 岁开始，跳过童年。
startAge: 16
# 到这个年龄自然寿终立
endAge: 60

# 每个周期（一年）开始，体力回满到这个值
maxEnergy: 2
# 移动到相邻格子消耗的体力
moveCost: 1

# 每周期结束时的自然生命流失（随时间递增，这是主要的时钟）
# 一整局总计约 95 点，健康开局 100 点，留给事件伤害的余量很小。
# 这个数字决定了"你有多宽裕"。
hpDrain:
  # 前这么多周期不流失
  startCycle: 6
  # 每过这么多周期，流失 +1
  everyCycles: 6

# 检定：掷 d20 + 属性 >= 难度。
# 成功率由这个公式精确计算并显示给玩家，不需要在这里配置。
# 难度参考：属性 5 时，dc 10 约 75%，dc 15 约 50%，dc 20 约 25%。
check:
  # 保留字段：以后如果要做"熟练加值"之类的修正，在这里加
  bonus: 0

# 低血量死亡判定（每周期结算一次）
death:
  # 生命比例低于此值出现警告
  warnBelow: 0.3
  # 低于此值开始每周期掷骰
  rollBelow: 0.3
  # 概率 = (rollBelow - 生命比例) * slope
  slope: 3.0
  # 低于此值必死
  certainBelow: 0.05

# 善恶如何影响下一世
karma:
  # 上一世善值每这么多点，五项属性各 +1
  statBonusDivisor: 20
  # 恶值达到 -100 时，负面效果打折到 (1 - penaltyReduction)
  penaltyReduction: 0.4
  # 上一世恶值每这么多点，五项属性各 -1
  statPenaltyDivisor: 40
  # 死亡时，本世善恶累积到元存档的比例
  carryover: 0.5

# 宿命进度达到这个值才能触发最终事件。
# 实测：随机乱走的人一局能到 48 左右，有意识地探深渊能到 80+。
# 门槛设在这里的意思是"你得认真找，才找得到结局"。
endingThreshold: 45
