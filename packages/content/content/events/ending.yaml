# ============================================================
#  结局
#  宿命进度达到 rules.endingThreshold 后，深渊会出现最终事件。
#  M1 只做假结局。真结局留一个占位判定（见文件末尾）。
# ============================================================

# ------------------------------------------------------------ 最终事件：假结局
- id: e_abyss_final
  title: 深渊之下
  tags: [abyss, final]
  weight: 100
  unique: true
  requires:
    - progressMin: 45
  text: >
    你顺着裂缝一直往下。爬了不知道多久，脚下终于有了平地。
    这里比你想的要空旷——像一座倒扣在地上的大殿，穹顶是你来的方向。
    大殿尽头有一扇门。门上有七道锁链，锁链已经断了两道。
    门前面坐着一个人，背对着你。
  options:
    - text: 走过去
      result:
        text: >
          那个人慢慢回过头。你看清了他的脸，然后明白了一件事——
          你认识他。你在镜子里见过他，在每一个梦里见过他。
          「你也是来开门的。」他说，语气很平，「每一个都是。」
        effects: [{ progress: 100 }, { flag: f_final_met }, { knowledge: k_self_under_abyss }]
    - text: 先看看那七道锁链
      check: { attr: int, dc: 13 }
      success:
        text: >
          断掉的两道，断口朝向内侧——是从门里面挣断的。
          剩下五道，锁扣上都刻着同一个名字。你念出来的时候，那个人抖了一下。
        effects: [{ progress: 100 }, { flag: f_final_met }, { knowledge: k_five_chains_named }, { attr: { int: 1 } }]
      fail:
        text: >
          你靠得太近了。锁链上的东西在你脑里响了一声，
          你跪在地上，鼻血滴在石板上。等你抬起头，那个人已经不在了。
        effects: [{ hp: -15 }, { progress: 100 }, { flag: f_final_met }]
    - text: 转身往上爬
      result:
        text: >
          你爬回去了。没人拦你。
          回到地面上时正是冬天，你在雪地里躺了很久，看着天。
          你知道自己还会再来。也知道下一次，你还是会走到这里。
        effects: [{ progress: 100 }, { flag: f_final_refused }]
